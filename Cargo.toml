[package]
name = "website"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.45"
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
async-recursion = "1.1.1"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tera = { version = "2.4.0", features = ["glob_fs"] }
tera-contrib = { version = "0.3.0", features = ["regex", "json"] }
ammonia = "4.1.4"
bb8-postgres = "0.9.0"
dotenvy = "0.15.7"
thiserror = "2.0.20"
sentry = { version = "0.49.2", features = ["tracing"] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["timeout", "trace", "fs"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["full"] }
argon2 = "0.6.0"
time = "0.3.55"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
cookie = "0.18.2"
regex = "1.13.1"
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
base64 = "0.23.1"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.146.0", features = ["behavior-version-latest"] }
governor = "0.10.4"
tower_governor = { version = "0.8.0", features = ["axum"] }
htmldiff = { path = "./htmldiff" }
axum-client-ip = "1.3.1"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = "0.13.5"
