<!DOCTYPE html>
<html class="h-100" lang="en">

<head>
    {% set page_title = "Create Account" %}
    {% include "header_template.html" %}
    <link rel="stylesheet" href="/static/css/auth.css">

</head>

<body class="h-100">
    
    <!--*******************
        Preloader start
    ********************-->
    <div id="preloader" role="status" aria-label="Loading" aria-hidden="true">
        <div class="loader">
            <svg class="circular" viewBox="25 25 50 50" aria-hidden="true" focusable="false">
                <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10" />
            </svg>
        </div>
    </div>
    <!--*******************
        Preloader end
    ********************-->

    

    <main id="main-content" class="auth-shell">

      <div class="auth-card">
        <h1 class="auth-title">Create account</h1>
        <p class="auth-sub">Welcome to AnkiCollab.</p>

        <form action="/signup" method="post" class="auth-form form-valide">
          <!-- The .form-group wrappers are load-bearing: jquery.validate appends
               each message to the closest .form-group and marks that parent
               .is-invalid, so removing them would silence every error. -->
          <div class="form-group">
            <label for="username" class="visually-hidden">Username</label>
            <input type="text" class="form-control" placeholder="Username" name="username" id="username" autocomplete="username" required minlength="3" maxlength="32">
          </div>

          <div class="form-group auth-password">
            <label for="password" class="visually-hidden">Password</label>
            <input type="password" class="form-control" placeholder="Password" name="password" id="password" autocomplete="new-password" required minlength="6" maxlength="128">
            <button type="button" class="auth-reveal" data-password-toggle="password" aria-pressed="false" aria-label="Show password">Show</button>
          </div>

          <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="val-terms" name="val-terms" value="1" required>
            <label class="form-check-label" for="val-terms">
              I agree to the <a href="/terms">Terms of Service</a> and
              <a href="/privacy">Privacy Policy</a>
            </label>
          </div>

          <!-- Kept for the login handler, which reads it as the "remember me"
               flag. Sign-up does not offer a choice, so it never renders. -->
          <input type="checkbox" class="d-none" id="cookie" name="cookie" value="0" aria-hidden="true" tabindex="-1">

          <button type="submit" class="auth-btn auth-btn--primary">Create account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
      </div>

    </main>

    <!--**********************************
        Scripts
    ***********************************-->
        <script src="/static/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/custom.min.js"></script>
    <script src="/static/js/settings.js"></script>
    <script src="/static/js/gleek.js"></script>
    <script src="/static/js/styleSwitcher.js"></script>
    <script src="/static/js/auth.js"></script>

    <script src="/static/plugins/validation/jquery.validate.min.js"></script>
    <script src="/static/plugins/validation/jquery.validate-init.js"></script>
</body>
</html>
