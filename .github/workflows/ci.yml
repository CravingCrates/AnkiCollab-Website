name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # -D warnings denies clippy::all + clippy::pedantic (enforced by the
        # #![warn(...)] attributes in main.rs). -A clippy::nursery excludes
        # the nursery group specifically, since those lints are explicitly
        # unstable/experimental and shouldn't be able to break CI on their own.
        run: cargo clippy --all-targets --all-features -- -D warnings -A clippy::nursery

      - name: Run tests
        run: cargo test --all-features --verbose
